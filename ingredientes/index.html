<!doctype html>
<html lang="es-AR">
<head>
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TP275NCXB8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('js', new Date());
    gtag('config', 'G-TP275NCXB8');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingredientes | GimmeMakeup</title>
  <meta name="description" content="Consultá los ingredientes de los productos de maquillaje de GimmeMakeup.">
  <link rel="icon" type="image/svg+xml" href="/images/logo-gimme.svg">
  <link rel="stylesheet" href="/src/css/main.css">
  <style>
    .ingredients__header,
    .ingredients__layout {
      max-width: 66rem;
      margin-inline: auto;
    }

    .ingredients__header h1 {
      margin-top: 1.5rem;
      font-family: "Evil Empire", sans-serif;
      font-size: clamp(2.5rem, 12vw, 7rem);
      font-weight: 400;
      line-height: 1;
    }

    .ingredients__back {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    .ingredients__layout {
      display: grid;
      grid-template-columns: 13rem minmax(0, 1fr);
      gap: 2rem;
      align-items: start;
    }

    .ingredients__filters {
      position: sticky;
      top: 1.5rem;
      min-inline-size: 0;
      border: 0;
    }

    .ingredients__filters legend {
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    .ingredients__options {
      display: grid;
      gap: 0.5rem;
    }

    .ingredients__option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 0.75rem;
      border: 1px solid #59303e;
      border-radius: 0.5rem;
      cursor: pointer;
    }

    .ingredients__option:has(:checked) {
      color: white;
      background: #371c27;
      border-color: #371c27;
      font-weight: 700;
    }

    .ingredients__option:focus-within {
      outline: 2px solid #371c27;
      outline-offset: 2px;
    }

    .ingredients__option input {
      accent-color: #371c27;
    }

    .ingredients__status {
      margin-bottom: 0.75rem;
    }

    @media (max-width: 768px) {
      .ingredients__layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 1.5rem;
      }

      .ingredients__filters {
        position: static;
      }

      .ingredients__options {
        display: flex;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <main class="ingredients" id="ingredientes">
    <header class="ingredients__header">
      <nav aria-label="Navegación principal">
        <a class="ingredients__back" href="/#productos">Volver a productos</a>
      </nav>
      <h1>Ingredientes</h1>
      <p class="ingredients__intro">Elegí un producto para consultar sus ingredientes.</p>
    </header>

    <div class="ingredients__layout">
      <fieldset class="ingredients__filters" id="ingredients-filters" hidden>
        <legend>Tipo de producto</legend>
        <div class="ingredients__options" id="ingredients-options"></div>
      </fieldset>

      <div>
        <p class="ingredients__status" id="ingredients-status" role="status"></p>
        <div class="ingredients__list" id="ingredients-list"></div>
        <noscript><p>Activá JavaScript para consultar los ingredientes.</p></noscript>
      </div>
    </div>
  </main>

  <footer class="footer">

    <div class="footer__inner">

      <div class="footer__brand">

        <img
          src="/images/logo-gimme.svg"
          alt="GimmeMakeup"
        >

      </div>

      <nav
        class="footer__nav"
        aria-label="Navegación del pie"
      >

        <a href="/#productos">Productos</a>
        <a href="/ingredientes/" aria-current="page">Ingredientes</a>

        <a
          href="https://www.instagram.com/gimmemakeup.arg/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram
        </a>

      </nav>

      <div class="footer__bottom">

        <p>© 2026 GimmeMakeup</p>
        <p>Maquillaje y sets de belleza</p>

      </div>

    </div>

  </footer>

  <script type="module" src="/src/ingredients.js"></script>
</body>
</html>
